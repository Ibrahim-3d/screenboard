<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board</title>
    <style>
      :root {
        --bg: #1e1e1e;
        --panel: #2c2c2c;
        --line: #3d3d3d;
        --ink: #e6e6e6;
        --dim: #9a9a9a;
        --accent: #0d99ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 system-ui, sans-serif;
      }
      header {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 3;
        display: flex;
        gap: 8px;
        align-items: center;
        height: 44px;
        padding: 0 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      header b {
        margin-right: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      header .sp {
        flex: 1;
      }
      header .tabs {
        display: flex;
        gap: 4px;
      }
      header .tabs:empty {
        display: none;
      }
      header .tabs + .tabs {
        padding-left: 8px;
        border-left: 1px solid var(--line);
      }
      header button {
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      header button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      header button:focus-visible,
      .frame .label :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #zoom {
        min-width: 52px;
        text-align: center;
        color: var(--dim);
      }
      #view {
        position: absolute;
        inset: 44px 0 0 0;
        overflow: hidden;
        cursor: default;
      }
      html.cm-side-open #view {
        right: 320px;
      }
      #view.panning,
      #view.panning * {
        cursor: grabbing !important;
      }
      /* While panning or moving a frame, frames must not swallow the pointer. */
      #view.panning iframe,
      #view.space iframe,
      #view.moving iframe {
        pointer-events: none;
      }
      #view.space {
        cursor: grab;
      }
      .frame.dragging {
        position: relative;
        z-index: 2;
        outline: 2px solid var(--accent);
        outline-offset: 6px;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        display: grid;
        gap: 220px;
        width: max-content;
      }
      #keys {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        color: var(--ink);
        /* no container: a soft outline keeps the labels readable over white pages */
        text-shadow: 0 0 2px var(--bg), 0 0 2px var(--bg), 0 0 4px var(--bg), 0 0 4px var(--bg), 0 0 8px var(--bg);
        font-size: 12px;
        pointer-events: none;
      }
      #keys kbd {
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: var(--panel);
        color: var(--ink);
        font: 600 11px/1.4 system-ui, sans-serif;
      }
      #play-count {
        min-width: 44px;
        text-align: center;
        color: var(--dim);
      }
      #empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--dim);
        font-size: 15px;
      }
      #empty[hidden] {
        display: none;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(var(--cols), max-content);
        align-items: start;
        gap: 160px 160px;
      }
      .pair {
        display: flex;
        align-items: flex-start;
        gap: 80px;
      }
      .section > h2 {
        margin: 0 0 24px;
        font-size: 56px;
        font-weight: 600;
        color: var(--dim);
      }
      .frame .label {
        cursor: move;
        user-select: none;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
        font-size: 22px;
        color: var(--dim);
        white-space: nowrap;
      }
      .frame .label a {
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--ink);
        text-decoration: none;
      }
      .frame .label a:hover {
        color: var(--accent);
      }
      .frame .label .play {
        cursor: pointer;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        padding: 4px 14px;
        border-radius: 999px;
        border: 1px solid var(--dim);
        background: transparent;
        color: var(--ink);
      }
      .frame .label .play:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      #play {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        flex-direction: column;
        background: var(--panel);
      }
      #play.on {
        display: flex;
      }
      #play header {
        position: static;
      }
      #play iframe {
        flex: 1;
        border: 0;
        width: 100%;
        background: #fff;
      }
      .frame .screen {
        position: relative;
        overflow: hidden;
        background: #fff;
        outline: 1px solid var(--line);
        box-shadow: 0 10px 40px rgb(0 0 0 / 0.45);
      }
      .frame .screen iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .frame .screen .idle {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--dim);
        background: var(--panel);
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <header>
      <b id="title"></b>
      <span class="tabs" id="spaces"></span>
      <span class="tabs" id="devices"></span>
      <button id="full" aria-pressed="true">Full length</button>
      <span class="sp"></span>
      <button id="out" aria-label="Zoom out">−</button>
      <span id="zoom">100%</span>
      <button id="in" aria-label="Zoom in">+</button>
      <button id="fit">Fit</button>
      <button id="reset">Reset layout</button>
      <button id="reload">Reload frames</button>
      <span id="cm-slot"></span>
      <button id="play-all">▶ Preview</button>
    </header>
    <main id="view"><div id="world"></div><div id="empty" hidden></div></main>
    <aside id="keys" aria-label="Shortcuts">
      <span><kbd>C</kbd> Comments</span>
      <span><kbd>Drag</kbd> Pan</span>
      <span><kbd>Space</kbd> + <kbd>Drag</kbd> Pan over frames</span>
      <span><kbd>Ctrl</kbd> + <kbd>Scroll</kbd> Zoom</span>
      <span><kbd>Shift</kbd> + <kbd>1</kbd> Fit</span>
    </aside>
    <div id="play">
      <header>
        <button id="play-prev" aria-label="Previous frame">‹</button>
        <span id="play-count"></span>
        <button id="play-next" aria-label="Next frame">›</button>
        <b id="play-title"></b>
        <span class="sp"></span>
        <button id="play-close">Close</button>
      </header>
      <iframe id="play-frame" title="Preview"></iframe>
    </div>
    <script>
      // Canvas of live frames: every frame is a same-origin <iframe> (the app through the proxy, or a mockup file), usable
      // in place. Frames load when they come on screen. Two spaces: App (routes × devices) and Mockups (HTML files).
      const view = document.getElementById("view");
      const world = document.getElementById("world");
      const playFrame = document.getElementById("play-frame");
      let cfg = { title: "Board", frames: [] };
      let key = "board";
      let space = "App";
      let device = "all";
      let full = true;
      let moved = {};
      let cam = { x: 60, y: 60, s: 0.25 };
      const store = (k, v) => {
        try {
          localStorage.setItem(key + ":" + k, typeof v === "string" ? v : JSON.stringify(v));
        } catch {}
      };
      const load = (k) => {
        try {
          return localStorage.getItem(key + ":" + k);
        } catch {
          return null;
        }
      };

      function restore() {
        try {
          cam = { x: 60, y: 60, s: 0.25, ...JSON.parse(load(space + ":cam")) };
        } catch {}
        try {
          moved = JSON.parse(load("moved")) || {};
        } catch {}
        device = load(space + ":device") || "all";
        full = load("full") !== "0";
      }
      function apply() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
        document.getElementById("zoom").textContent = Math.round(cam.s * 100) + "%";
        store(space + ":cam", cam);
        document.querySelectorAll(".frame.loaded iframe").forEach((f) => f.contentWindow?.CM?.relayout?.());
      }

      /**
       * Full length: pin viewport units (vh/svh/dvh/lvh) inside the frame to the device height, then grow the frame to
       * the page's scroll height, so a 100svh hero stays one screen tall instead of filling the whole frame.
       */
      function freeze(doc, h) {
        const px = (v) => v.replace(/(-?[\d.]+)(s|d|l)?vh\b/g, (_, n) => `${(n * h) / 100}px`);
        for (const sheet of doc.styleSheets) {
          let rules;
          try {
            rules = sheet.cssRules;
          } catch {
            continue;
          }
          const walk = (list) => {
            for (const r of list) {
              if (r.cssRules) walk(r.cssRules);
              if (!r.style || r.__frozen === h) continue;
              for (const prop of r.style) {
                const v = r.style.getPropertyValue(prop);
                if (/vh\b/.test(v)) r.style.setProperty(prop, px(v), r.style.getPropertyPriority(prop));
              }
              r.__frozen = h;
            }
          };
          walk(rules);
        }
      }
      function grow(frame) {
        const f = frame.querySelector("iframe");
        const box = frame.querySelector(".screen");
        const h = Number(box.dataset.h);
        let doc = null;
        try {
          doc = f.contentDocument;
        } catch {}
        if (!full || !doc?.documentElement) return (box.style.height = h + "px");
        freeze(doc, h);
        box.style.height = Math.max(h, doc.documentElement.scrollHeight) + "px";
      }
      // Lazy content, reveals and hot reloads change page length: re-measure loaded frames now and then.
      setInterval(() => document.querySelectorAll(".frame.loaded").forEach(grow), 1500);

      const visible = () => cfg.frames.filter((f) => f.space === space && (device === "all" || !f.device || f.device === device));
      function tabs(id, values, current, label, onPick) {
        const slot = document.getElementById(id);
        slot.replaceChildren();
        if (values.length < 2) return;
        values.forEach((v) => {
          const b = document.createElement("button");
          b.textContent = label(v);
          b.setAttribute("aria-pressed", v === current);
          b.onclick = () => onPick(v);
          slot.append(b);
        });
      }
      function header() {
        const spaces = [...new Set(cfg.frames.map((f) => f.space))];
        tabs("spaces", spaces, space, (v) => v, (v) => {
          store("space", (space = v));
          restore();
          layout();
          if (!onScreen()) fit();
        });
        const devices = [...new Set(cfg.frames.filter((f) => f.space === space && f.device).map((f) => f.device))];
        tabs("devices", devices.length > 1 ? ["all", ...devices] : [], device, (v) => (v === "all" ? "All" : v), (v) => {
          store(space + ":device", (device = v));
          layout();
        });
        document.getElementById("full").setAttribute("aria-pressed", full);
      }

      let io;
      function layout() {
        header();
        world.replaceChildren();
        io?.disconnect();
        io = new IntersectionObserver(
          (es) =>
            es.forEach((e) => {
              const f = e.target.querySelector("iframe");
              if (e.isIntersecting && !f.src) f.src = f.dataset.src;
            }),
          { root: view, rootMargin: "400px" },
        );
        const sections = new Map();
        for (const fr of visible()) {
          const s = sections.get(fr.section) || new Map();
          s.set(fr.pair, [...(s.get(fr.pair) || []), fr]);
          sections.set(fr.section, s);
        }
        const empty = document.getElementById("empty");
        empty.hidden = sections.size > 0;
        empty.textContent = cfg.frames.length ? "" : "Nothing to show yet: run init or add a mockup.";
        for (const [name, pairs] of sections) {
          const sec = document.createElement("section");
          sec.className = "section";
          const h2 = document.createElement("h2");
          h2.textContent = name;
          const row = document.createElement("div");
          row.className = "row";
          row.style.setProperty("--cols", cfg.columns?.[name] || cfg.columns?.default || (space === "App" ? 3 : 4));
          sec.append(h2, row);
          for (const list of pairs.values()) {
            const pair = document.createElement("div");
            pair.className = "pair";
            list.forEach((d) => pair.append(frameEl(d)));
            row.append(pair);
          }
          world.append(sec);
        }
        apply();
      }
      function frameEl(d) {
        const fr = document.createElement("div");
        fr.className = "frame";
        fr.style.width = d.width + "px";
        fr.dataset.id = d.id;
        const o = moved[d.id];
        if (o) fr.style.translate = `${o[0]}px ${o[1]}px`;
        const label = document.createElement("div");
        label.className = "label";
        const a = document.createElement("a");
        a.href = d.url;
        a.target = "_blank";
        a.textContent = d.label;
        const size = document.createElement("span");
        size.textContent = [d.device, d.width].filter(Boolean).join(" ");
        const play = document.createElement("button");
        play.className = "play";
        play.textContent = "▶ Preview";
        play.setAttribute("aria-label", `Preview ${d.label}`);
        play.addEventListener("click", () => openPlay(d));
        const right = document.createElement("span");
        right.style.cssText = "display:flex;gap:16px;align-items:center";
        right.append(play, size);
        label.append(a, right);
        const box = document.createElement("div");
        box.className = "screen";
        box.dataset.h = d.height;
        box.style.cssText = `width:${d.width}px;height:${d.height}px`;
        const f = document.createElement("iframe");
        f.title = d.label;
        f.dataset.src = d.url;
        f.dataset.frame = d.id;
        const idle = document.createElement("div");
        idle.className = "idle";
        idle.textContent = d.label;
        box.append(f, idle);
        fr.append(label, box);
        f.addEventListener("load", () => {
          idle.remove();
          fr.classList.add("loaded");
          grow(fr);
        });
        io.observe(fr);
        return fr;
      }

      function zoomAt(f, cx, cy) {
        const s = Math.min(2, Math.max(0.03, cam.s * f));
        cam.x = cx - (cx - cam.x) * (s / cam.s);
        cam.y = cy - (cy - cam.y) * (s / cam.s);
        cam.s = s;
        apply();
      }
      // Fit the width (full-length pages make the board very tall); scroll down to see the rest.
      function fit() {
        const r = view.getBoundingClientRect();
        cam.s = Math.min(1, (r.width - 80) / (world.offsetWidth || 1));
        cam.x = 40;
        cam.y = 40;
        apply();
      }
      const onScreen = () => {
        const vr = view.getBoundingClientRect();
        return [...document.querySelectorAll(".frame")].some((f) => {
          const b = f.getBoundingClientRect();
          return b.right > vr.left && b.left < vr.right && b.bottom > vr.top && b.top < vr.bottom;
        });
      };

      // Hooks for the frames and the comment layer (same origin).
      const cfgReady = fetch("api/config").then((r) => r.json());
      window.BOARD = {
        cfg: cfgReady,
        get zoom() {
          return cam.s;
        },
        zoomOf: (iframe) => (iframe === playFrame ? 1 : cam.s),
        space(on) {
          view.classList.toggle("space", on);
        },
        wheel(e, iframe) {
          if (iframe === playFrame) return;
          const fr = iframe.getBoundingClientRect();
          const r = view.getBoundingClientRect();
          zoomAt(Math.exp(-e.deltaY * 0.002), fr.left + e.clientX * cam.s - r.left, fr.top + e.clientY * cam.s - r.top);
        },
        // Bring a pin's frame to the middle of the view (switching space if needed) and open the pin there.
        focus(pin) {
          const d = cfg.frames.find((x) => x.id === pin.frame) || cfg.frames.find((x) => x.url.split("#")[0] === pin.screen.split("#")[0]);
          if (!d) return;
          if (playBox.classList.contains("on")) closePlay();
          if (d.space !== space || (d.device && device !== "all" && device !== d.device)) {
            store("space", (space = d.space));
            restore();
            device = "all";
            layout();
          }
          const fr = [...document.querySelectorAll(".frame")].find((x) => x.dataset.id === d.id);
          if (!fr) return;
          const f = fr.querySelector("iframe");
          let here = "";
          try {
            here = decodeURIComponent(f.contentWindow.location.pathname + f.contentWindow.location.hash);
          } catch {}
          if (pin.screen && (!f.src || (here && here !== pin.screen))) f.src = pin.screen; // the frame navigated away: go back to the pin's page
          else if (!f.src) f.src = f.dataset.src;
          if (cam.s < 0.5) cam.s = 0.5;
          apply();
          const r = fr.getBoundingClientRect();
          const v = view.getBoundingClientRect();
          cam.x += v.left + v.width / 2 - (r.left + r.width / 2);
          cam.y += v.top + 80 - r.top;
          apply();
          let tries = 0;
          const go = () => {
            const cm = f.contentWindow?.CM;
            if (cm?.show && f.contentDocument?.readyState === "complete") return cm.show(pin.id);
            if (tries++ < 60) setTimeout(go, 150);
          };
          go();
        },
      };

      // A page that focuses itself while loading would take the board's keys (C, Space): a frame keeps focus only when
      // the pointer is over it (the user clicked in).
      let hovered = null;
      world.addEventListener("pointerover", (e) => e.target.tagName === "IFRAME" && (hovered = e.target));
      world.addEventListener("pointerout", (e) => e.target === hovered && (hovered = null));
      addEventListener("blur", () =>
        setTimeout(() => {
          const a = document.activeElement;
          if (a?.tagName === "IFRAME" && a !== hovered && a !== playFrame) (a.blur(), window.focus());
        }),
      );

      // Figma-style navigation: wheel pans the board (outside frames), Ctrl/Cmd + wheel or pinch zooms.
      view.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const r = view.getBoundingClientRect();
          if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.002), e.clientX - r.left, e.clientY - r.top);
          else {
            cam.x -= e.deltaX;
            cam.y -= e.deltaY;
            apply();
          }
        },
        { passive: false },
      );
      // Move a frame: drag its label bar. Offsets are saved per frame; "Reset layout" clears them.
      let move = null;
      view.addEventListener("pointerdown", (e) => {
        const label = e.target.closest(".label");
        if (!label || e.button !== 0 || e.target.closest("a, button")) return;
        const fr = label.closest(".frame");
        move = { fr, x: e.clientX, y: e.clientY, o: moved[fr.dataset.id] || [0, 0] };
        fr.classList.add("dragging");
        view.classList.add("moving");
        view.setPointerCapture(e.pointerId);
        e.preventDefault();
        e.stopImmediatePropagation();
      });
      view.addEventListener("pointermove", (e) => {
        if (!move) return;
        const dx = move.o[0] + (e.clientX - move.x) / cam.s;
        const dy = move.o[1] + (e.clientY - move.y) / cam.s;
        moved[move.fr.dataset.id] = [Math.round(dx), Math.round(dy)];
        move.fr.style.translate = `${dx}px ${dy}px`;
      });
      view.addEventListener("pointerup", () => {
        if (!move) return;
        move.fr.classList.remove("dragging");
        view.classList.remove("moving");
        move = null;
        store("moved", moved);
        apply();
      });

      let drag = null;
      view.addEventListener("pointerdown", (e) => {
        const bg = !e.target.closest(".screen, .label");
        if (e.button === 1 || view.classList.contains("space") || (e.button === 0 && bg)) {
          drag = { x: e.clientX, y: e.clientY };
          view.classList.add("panning");
          view.setPointerCapture(e.pointerId);
          e.preventDefault();
        }
      });
      view.addEventListener("pointermove", (e) => {
        if (!drag) return;
        cam.x += e.clientX - drag.x;
        cam.y += e.clientY - drag.y;
        drag = { x: e.clientX, y: e.clientY };
        apply();
      });
      view.addEventListener("pointerup", () => {
        drag = null;
        view.classList.remove("panning");
      });
      addEventListener("keydown", (e) => {
        if (e.code === "Space" && !e.repeat && !/INPUT|TEXTAREA/.test(e.target.tagName)) view.classList.add("space");
        if ((e.ctrlKey || e.metaKey) && (e.key === "=" || e.key === "+")) (e.preventDefault(), zoomAt(1.25, innerWidth / 2, innerHeight / 2));
        if ((e.ctrlKey || e.metaKey) && e.key === "-") (e.preventDefault(), zoomAt(0.8, innerWidth / 2, innerHeight / 2));
        if (e.shiftKey && e.code === "Digit1" && !/INPUT|TEXTAREA/.test(e.target.tagName)) fit();
      });
      addEventListener("keyup", (e) => e.code === "Space" && view.classList.remove("space"));
      document.getElementById("in").onclick = () => zoomAt(1.25, view.clientWidth / 2, view.clientHeight / 2);
      document.getElementById("out").onclick = () => zoomAt(0.8, view.clientWidth / 2, view.clientHeight / 2);
      document.getElementById("fit").onclick = fit;
      document.getElementById("full").onclick = () => {
        full = !full;
        store("full", full ? "1" : "0");
        // un-freezing vh needs fresh stylesheets: reload the loaded frames
        document.querySelectorAll(".frame.loaded iframe").forEach((f) => (f.src = f.dataset.src));
        header();
      };
      document.getElementById("reset").onclick = () => {
        moved = {};
        store("moved", moved);
        document.querySelectorAll(".frame").forEach((f) => (f.style.translate = ""));
      };
      document.getElementById("reload").onclick = () => document.querySelectorAll("iframe[src]").forEach((f) => (f.src = f.dataset.src));

      // Preview: a frame at full size inside the board; the page keeps its own comment mode and pins.
      // The header ▶ Preview starts on the frame nearest the middle of the view; ‹ › and the arrow keys step through the
      // frames of the current space in board order.
      const playBox = document.getElementById("play");
      let playList = [];
      let playAt = 0;
      function openPlay(d) {
        playList = visible();
        playAt = Math.max(0, playList.findIndex((x) => x.id === d.id));
        showPlay();
        playBox.classList.add("on");
      }
      function showPlay() {
        const d = playList[playAt];
        document.getElementById("play-title").textContent = [d.label, d.device].filter(Boolean).join(" · ");
        document.getElementById("play-count").textContent = playList.length > 1 ? `${playAt + 1} / ${playList.length}` : "";
        ["play-prev", "play-next"].forEach((id) => (document.getElementById(id).hidden = playList.length < 2));
        playFrame.style.cssText = `max-width:${d.width}px;margin:0 auto`;
        playFrame.dataset.frame = d.id;
        playFrame.src = d.url;
      }
      function stepPlay(n) {
        if (playList.length < 2) return;
        playAt = (playAt + n + playList.length) % playList.length;
        showPlay();
      }
      function closePlay() {
        playBox.classList.remove("on");
        playFrame.src = "about:blank";
      }
      document.getElementById("play-all").addEventListener("click", () => {
        const v = view.getBoundingClientRect();
        const mid = [v.left + v.width / 2, v.top + v.height / 2];
        const dist = (f) => { const b = f.getBoundingClientRect(); return Math.hypot((b.left + b.right) / 2 - mid[0], (b.top + Math.min(b.bottom, v.bottom)) / 2 - mid[1]); };
        const near = [...document.querySelectorAll(".frame")].sort((a, b) => dist(a) - dist(b))[0];
        const d = cfg.frames.find((x) => x.id === near?.dataset.id) || visible()[0];
        if (d) openPlay(d);
      });
      document.getElementById("play-prev").addEventListener("click", () => stepPlay(-1));
      document.getElementById("play-next").addEventListener("click", () => stepPlay(1));
      document.getElementById("play-close").addEventListener("click", closePlay);
      document.addEventListener("keydown", (e) => {
        if (!playBox.classList.contains("on")) return;
        if (e.key === "Escape") closePlay();
        if (e.key === "ArrowRight") stepPlay(1);
        if (e.key === "ArrowLeft") stepPlay(-1);
      });

      cfgReady.then((c) => {
        cfg = c;
        key = "board:" + c.title;
        document.title = c.title;
        document.getElementById("title").textContent = c.title;
        const spaces = [...new Set(c.frames.map((f) => f.space))];
        space = load("space");
        if (!spaces.includes(space)) space = spaces[0] || "App";
        restore();
        layout();
        // A saved view from an older layout can point at empty space: fit when nothing is on screen.
        if (!onScreen()) fit();
      });
    </script>
    <script src="comments.js"></script>
  </body>
</html>
